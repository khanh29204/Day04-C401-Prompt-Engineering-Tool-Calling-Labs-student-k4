# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: current_time
    description: "Lấy thời gian hiện tại từ API theo múi giờ, mặc định là Việt Nam (Asia/Ho_Chi_Minh)."
    parameters:
      type: object
      properties:
        timezone: {type: string, default: "Asia/Ho_Chi_Minh", description: "Múi giờ (ví dụ: Asia/Ho_Chi_Minh, VN)"}
      required: []

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- CGV cinema tools (bonus) ----------------
  # Ported from the cgv-mcp MCP server into tools/cgv/. Names must stay in sync
  # with TOOL_FUNCTIONS in tools/__init__.py. These declarations are extra tools
  # the model can see, so they can shift base-eval routing: comment out this
  # whole block (and the matching block in tools/__init__.py) to get the
  # original 10-tool surface back.
  - name: cgv_cinemas
    description: "Danh sách cụm rạp CGV, có thể lọc theo tỉnh/thành hoặc từ khóa. Trả về cinema_id dùng cho các tool CGV khác."
    parameters:
      type: object
      properties:
        city: {type: string, default: "", description: "Tên tỉnh/thành, bỏ dấu cũng được (ví dụ: ho chi minh)"}
        query: {type: string, default: "", description: "Từ khóa trong tên rạp hoặc địa chỉ"}
        limit: {type: integer, default: 30, description: "Số rạp tối đa"}
      required: []

  - name: cgv_movies
    description: "Danh sách phim đang chiếu và sắp chiếu tại CGV. Trả về sku dùng cho cgv_movie_schedules."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa trong tên phim"}
        category: {type: string, default: "all", description: "Nhóm phim của CGV (Now Showing, Coming Soon) hoặc all"}
        limit: {type: integer, default: 20, description: "Số phim tối đa"}
      required: []

  - name: cgv_movie_schedules
    description: "Suất chiếu của MỘT phim trong MỘT ngày, theo từng rạp. Dùng khi người dùng nói tên phim."
    parameters:
      type: object
      properties:
        sku: {type: string, default: "", description: "SKU phim, lấy từ cgv_movies (ví dụ: 26016500)"}
        date: {type: string, default: "", description: "Ngày: today, tomorrow, YYYY-MM-DD, DD/MM/YYYY hoặc DDMMYYYY. Rỗng = hôm nay"}
        city: {type: string, default: "", description: "Lọc theo tỉnh/thành"}
        cinema_query: {type: string, default: "", description: "Lọc theo tên rạp"}
        limit: {type: integer, default: 15, description: "Số rạp tối đa"}
      required: [sku]

  - name: cgv_cinema_schedules
    description: "Suất chiếu tại MỘT rạp trong MỘT ngày, theo từng phim. Dùng khi người dùng nói tên rạp."
    parameters:
      type: object
      properties:
        cinema_id: {type: string, default: "", description: "ID rạp, lấy từ cgv_cinemas (ví dụ: 006, giữ số 0 đầu)"}
        date: {type: string, default: "", description: "Ngày: today, tomorrow, YYYY-MM-DD, DD/MM/YYYY hoặc DDMMYYYY. Rỗng = hôm nay"}
        movie_query: {type: string, default: "", description: "Lọc theo tên phim"}
        limit: {type: integer, default: 20, description: "Số phim tối đa"}
      required: [cinema_id]

  - name: cgv_seatmap
    description: "Sơ đồ ghế và giá vé của một suất chiếu. Yêu cầu người dùng đã đăng nhập trên web app."
    parameters:
      type: object
      properties:
        cinema_id: {type: string, default: "", description: "ID rạp"}
        session_id: {type: string, default: "", description: "ID suất chiếu, lấy từ tool suất chiếu"}
        date: {type: string, default: "", description: "Ngày của suất chiếu"}
        status_filter: {type: string, default: "", description: "Chỉ giữ ghế có status đúng giá trị này; xem status_counts trước rồi mới lọc"}
        limit: {type: integer, default: 400, description: "Số ghế tối đa"}
      required: [cinema_id, session_id, date]

  - name: cgv_concession
    description: "Danh sách combo bắp nước của một suất chiếu. Yêu cầu người dùng đã đăng nhập trên web app."
    parameters:
      type: object
      properties:
        session_id: {type: string, default: "", description: "ID suất chiếu"}
        product: {type: string, default: "", description: "movie_id của phim (không phải sku)"}
        theater_id: {type: string, default: "", description: "ID rạp"}
        session_date: {type: string, default: "", description: "Ngày của suất chiếu"}
      required: [session_id, product, theater_id, session_date]

  - name: cgv_profile
    description: "Thông tin thành viên CGV (hạng thẻ, điểm tích lũy). Yêu cầu người dùng đã đăng nhập trên web app."
    parameters:
      type: object
      properties: {}
      required: []
  - name: wikipedia
    description: "Tra cứu bài viết trên Wikipedia. Ưu tiên tiếng Việt, nếu không có thì dùng tiếng Anh."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung tìm kiếm"}
        language: {type: string, enum: [auto, vi, en], default: "auto", description: "Ngôn ngữ ưu tiên"}
        max_results: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]
